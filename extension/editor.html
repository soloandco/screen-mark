<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Mark · 편집</title><link rel="stylesheet" href="editor.css"></head>
<body>
  <header class="topbar">
    <a class="brand" href="editor.html" title="새 이미지 열기"><span class="brand-icon">m<span>1</span></span><span>Screen Mark</span></a>
    <span class="divider"></span><span id="file-title">화면에 생각을 표시하세요</span>
    <div class="top-actions"><button id="open-file" class="quiet">이미지 열기</button><button id="download" class="secondary" title="표시한 화면을 PNG 파일로 저장" disabled>파일 저장</button><button id="copy" class="primary" title="표시한 화면을 클립보드로 복사 (Ctrl+C)" disabled>클립보드 복사 <span aria-hidden="true">Ctrl+C</span></button></div>
  </header>
  <div class="workspace">
    <aside class="tools" aria-label="편집 도구">
      <span class="section-label">MARK TOOLS</span>
      <button class="tool" data-tool="select" title="선택 / 이동 (V)" aria-label="선택 / 이동" aria-pressed="false"><span class="tool-icon">↖</span><span>선택</span><kbd>V</kbd></button>
      <button class="tool active" data-tool="rectangle" title="사각형 (R)" aria-label="사각형" aria-pressed="true"><span class="tool-icon">▭</span><span>사각형</span><kbd>R</kbd></button>
      <button class="tool" data-tool="number" title="원형 번호 라벨 (N)" aria-label="번호 라벨" aria-pressed="false"><span class="tool-icon number-icon">1</span><span>번호 라벨</span><kbd>N</kbd></button>
      <button class="tool" data-tool="arrow" title="화살표 (A)" aria-label="화살표" aria-pressed="false"><span class="tool-icon">↗</span><span>화살표</span><kbd>A</kbd></button>
      <button class="tool" data-tool="text" title="텍스트 (T)" aria-label="텍스트" aria-pressed="false"><span class="tool-icon text-icon">T</span><span>텍스트</span><kbd>T</kbd></button>
      <button class="tool" data-tool="mosaic" title="모자이크 (M)" aria-label="모자이크" aria-pressed="false"><span class="tool-icon">▦</span><span>모자이크</span><kbd>M</kbd></button>
      <button class="tool" data-tool="crop" title="자르기 (C)" aria-label="자르기" aria-pressed="false"><span class="tool-icon">⌗</span><span>자르기</span><kbd>C</kbd></button>
      <hr><span class="section-label">STYLE</span>
      <label class="field-label" for="color">표시 색상</label>
      <div class="colors"><button class="swatch" data-color="#e44d35" style="--swatch:#e44d35" aria-label="빨강"></button><button class="swatch" data-color="#216b52" style="--swatch:#216b52" aria-label="초록"></button><button class="swatch" data-color="#2f6de1" style="--swatch:#2f6de1" aria-label="파랑"></button><input id="color" type="color" value="#e44d35" title="직접 색상 선택" aria-label="직접 색상 선택"></div>
      <label class="field-label" for="stroke">선 굵기 <output id="stroke-value">4 px</output></label><input id="stroke" type="range" min="2" max="16" value="4">
      <label class="field-label" for="number-start">다음 번호</label><input id="number-start" type="number" min="1" max="999" value="1">
      <label class="field-label" for="label-size">번호 크기</label><select id="label-size"><option value="16">작게</option><option value="22" selected>보통</option><option value="30">크게</option></select>
      <div class="tool-bottom"><button id="delete" class="quiet" disabled>선택한 표시 삭제 <kbd>Del</kbd></button><p>사각형은 드래그,<br>번호는 클릭으로 추가하세요.</p></div>
    </aside>
    <main class="desk" id="desk">
      <div class="canvas-toolbar"><div class="history-buttons"><button id="undo" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소" disabled>↶</button><button id="redo" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행" disabled>↷</button><span id="shape-count">표시 0개</span></div><div class="zoom-controls"><button id="zoom-out" aria-label="축소">−</button><output id="zoom-value">100%</output><button id="zoom-in" aria-label="확대">+</button><button id="fit">화면 맞춤</button></div></div>
      <div id="canvas-scroll" class="canvas-scroll">
        <section id="empty" class="empty"><div class="empty-graphic" aria-hidden="true"><span class="empty-square"></span><span class="empty-number">1</span><span class="empty-line"></span><span class="empty-line short"></span></div><span class="section-label">A LITTLE MARK. A CLEARER MESSAGE.</span><h1>한 장이면 충분한 설명.</h1><p>화면을 캡처하거나 이미지를 열고,<br>사각형과 번호로 중요한 곳을 짚어 보세요.</p><button id="empty-open" class="primary">이미지 파일 열기 <span aria-hidden="true">↗</span></button><small>PNG · JPG · WebP / 파일을 여기로 끌어 놓아도 됨</small></section>
        <div id="canvas-frame" class="canvas-frame" hidden><canvas id="canvas" aria-label="이미지 편집 캔버스. 사각형은 드래그, 번호 라벨은 클릭으로 추가" tabindex="0"></canvas></div>
      </div>
      <footer class="statusbar"><span id="status" role="status" aria-live="polite">이미지는 외부로 전송되지 않음</span><span id="dimensions">LOCAL ONLY</span></footer>
    </main>
  </div>
  <input id="file-input" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <dialog id="text-dialog"><form method="dialog"><h2>텍스트 추가</h2><label for="text-input">화면에 표시할 내용</label><textarea id="text-input" rows="3" maxlength="500" required></textarea><div><button value="cancel" formnovalidate class="quiet">취소</button><button value="add" class="primary">추가</button></div></form></dialog>
  <script type="module" src="editor.js"></script>
</body></html>
