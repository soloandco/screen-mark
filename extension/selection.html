<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>선택 영역 캡처 · Screen Mark</title><link rel="stylesheet" href="selection.css"></head>
<body>
  <header><div><span class="brand">Screen Mark</span><h1>선택 영역 캡처</h1></div><div class="actions"><button id="cancel">취소 <kbd>Esc</kbd></button><button id="confirm" class="primary" disabled>선택 영역 사용 <kbd>Enter</kbd></button></div></header>
  <p class="guide">원하는 부분을 드래그하세요. 다시 드래그하면 선택 영역을 바꿀 수 있음.</p>
  <main id="stage"><div id="surface" hidden tabindex="0" role="img" aria-label="캡처할 영역을 드래그로 선택하는 고정된 화면"><img id="capture-image" alt="캡처 시점의 현재 화면" draggable="false"><div id="selection" hidden></div></div></main>
  <footer><span id="status" role="status" aria-live="polite">화면을 불러오는 중…</span><span id="dimensions"></span></footer>
  <script type="module" src="selection.js"></script>
</body>
</html>
